spring:
  application:
    name: msemprestimo
  datasource:
    url: jdbc:mysql://localhost:3306/msemprestimo?createDatabaseIfNotExist=true
    username: root
    password: root
  jpa:
    #hibernate:
    #ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 0

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${random.value}

