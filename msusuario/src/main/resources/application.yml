spring:
  application:
    name: msusuario
  datasource:
    url: jdbc:mysql://localhost:3306/msusuario?createDatabaseIfNotExist=true
    username: root
    password: root
  jpa:
    show-sql: true
    properties:
      hibernate.format_sql: true
      hibernate.type.preferred_uuid_jdbc_type: CHAR
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 0

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${random.value}