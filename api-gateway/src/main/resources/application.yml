spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: msusuario
              uri: lb://msusuario
              predicates:
                - Path=/api/v1/usuarios/**
            - id: msequipamento
              uri: lb://msequipamento
              predicates:
                - Path=/api/v1/equipamentos/**
            - id: msemprestimo
              uri: lb://msemprestimo
              predicates:
                - Path=/api/v1/emprestimos/**

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    hostname: localhost
