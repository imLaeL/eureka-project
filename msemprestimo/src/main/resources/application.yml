spring:
  application:
    name: msemprestimo
  datasource:
    url: jdbc:mysql://localhost:3306/msemprestimo?createDatabaseIfNotExist=true
    username: root
    password: root
  jpa:
    show-sql: true
    properties:
      hibernate.format_sql: true
      hibernate.type.preferred_uuid_jdbc_type: CHAR
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 0

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${random.value}

spring.cloud.openfeign:
  client:
    config:
      default:
        connect-timeout: 2000
        read-timeout: 5000

resilience4j:
  circuitbreaker:
    instances:
      atualizarCondicao:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 2
        ignoreExceptions:
          - feign.FeignException$FeignClientException
